<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#121212" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <!-- Favicon base (fallback) -->
    <link rel="icon" type="image/svg+xml" href="/logo-icon.svg" />
    <!-- Favicon segun tema del navegador (light/dark) -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="/logo-icon.svg"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/logo-icon-dark.svg"
      media="(prefers-color-scheme: dark)"
    />
    <!-- Apple usa un solo icono: dejamos el isotipo claro -->
    <link rel="apple-touch-icon" href="/logo-icon.svg" />

    <!-- SEO base -->
    <title>Worship Box — Secuencias, Charts y Recursos</title>
    <meta
      name="description"
      content="Biblioteca de secuencias, charts y recursos de producción musical. Descarga y comparte aportes de la comunidad."
    />
    <meta name="keywords" content="worship box, secuencias, charts, software, herramientas, recursos, multitracks, musica, descargar" />

    <!-- Open Graph -->
    <meta property="og:title" content="Worship Box — Secuencias, Charts y Recursos" />
    <meta property="og:description" content="Biblioteca de secuencias, charts y recursos de producción musical con aportes de la comunidad." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://worshipbox.vercel.app/" />
    <!-- Para redes usamos solo isotipo (logo-icon), en URL absoluta para mejor compatibilidad -->
    <meta property="og:image" content="https://worshipbox.vercel.app/logo-icon.svg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="1200" />
    <meta property="og:image:alt" content="Isotipo de Worship Box" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Worship Box — Secuencias, Charts y Recursos" />
    <meta name="twitter:description" content="Biblioteca de secuencias, charts y recursos de producción musical con aportes de la comunidad." />
    <meta name="twitter:image" content="https://worshipbox.vercel.app/logo-icon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
